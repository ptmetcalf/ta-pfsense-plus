name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync app.conf version in release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PLEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          pr_raw = os.environ.get("RELEASE_PLEASE_PR", "")
          if not pr_raw:
              raise SystemExit("release-please did not return PR metadata")

          try:
              pr = json.loads(pr_raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"invalid release-please PR JSON: {exc}") from exc

          branch = pr.get("headBranchName") or pr.get("branch")
          if not branch:
              raise SystemExit("could not determine release PR branch name")

          subprocess.run(["git", "checkout", branch], check=True)

          manifest_path = Path("app.manifest")
          app_conf_path = Path("default/app.conf")
          version = json.loads(manifest_path.read_text())["info"]["id"]["version"]

          lines = app_conf_path.read_text().splitlines()
          section = None
          updated = {"launcher": False, "id": False}
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("[") and stripped.endswith("]"):
                  section = stripped.strip("[]")
              if section in updated and stripped.startswith("version"):
                  out.append(f"version = {version}")
                  updated[section] = True
              else:
                  out.append(line)
          if not all(updated.values()):
              missing = [key for key, ok in updated.items() if not ok]
              raise SystemExit(f"Missing version in stanzas: {', '.join(missing)}")
          app_conf_path.write_text("\n".join(out) + "\n")

          subprocess.run(["git", "status", "--short"], check=True)
          result = subprocess.run(["git", "diff", "--quiet"])
          if result.returncode == 0:
              raise SystemExit("app.conf already up to date")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "default/app.conf"], check=True)
          subprocess.run(["git", "commit", "-m", "chore: sync app.conf version"], check=True)
          subprocess.run(["git", "push", "origin", branch], check=True)
          PY

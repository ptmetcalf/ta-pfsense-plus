name: release

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows:
      - "release-please"
    types:
      - completed

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          git fetch --tags --force
          TAG_NAME="$(git tag --points-at "${GITHUB_SHA}" | sort -V | tail -n1)"
          if [ -z "${TAG_NAME}" ]; then
            echo "No tag found for ${GITHUB_SHA}; skipping release packaging."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create app archive
        if: ${{ steps.tag.outputs.tag != '' }}
        run: |
          APP_NAME="ta-pfsense-plus"
          TAR_NAME="${APP_NAME}-${{ steps.tag.outputs.tag }}.tgz"
          TAR_PATH="${RUNNER_TEMP}/${TAR_NAME}"
          tar \
            --exclude="ta-pfsense-plus/.git" \
            --exclude="ta-pfsense-plus/.github" \
            --exclude="ta-pfsense-plus/.gitignore" \
            --exclude="ta-pfsense-plus/.release-please-config.json" \
            --exclude="ta-pfsense-plus/.release-please-manifest.json" \
            --exclude="ta-pfsense-plus/.claude" \
            --exclude="ta-pfsense-plus/.DS_Store" \
            --exclude="ta-pfsense-plus/.venv-appinspect" \
            --exclude="ta-pfsense-plus/dist" \
            --exclude="ta-pfsense-plus/tools" \
            -czf "${TAR_PATH}" -C .. ta-pfsense-plus
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"
          echo "TAR_PATH=${TAR_PATH}" >> "$GITHUB_ENV"
          echo "APP_NAME=${APP_NAME}" >> "$GITHUB_ENV"

      - name: Set up Python
        if: ${{ steps.tag.outputs.tag != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AppInspect
        if: ${{ steps.tag.outputs.tag != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install splunk-appinspect

      - name: Run AppInspect
        if: ${{ steps.tag.outputs.tag != '' }}
        run: |
          splunk-appinspect inspect "${TAR_PATH}" \
            --mode precert \
            --data-format json \
            --output-file "${APP_NAME}-appinspect.json" \
            --ci

      - name: Upload AppInspect report
        if: ${{ steps.tag.outputs.tag != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-appinspect
          path: ${{ env.APP_NAME }}-appinspect.json

      - name: Create release
        if: ${{ steps.tag.outputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ env.TAR_PATH }}

[pfsense_sourcetyper]
#REGEX = [\w\-\:\+]+\s[\w\:\.]+\s(?P<sourcetype>\S+)\[
REGEX = \w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}\s+(?:[\w.-]+\s+)?(?P<sourcetype>\w+)(?:\[\d+\])?:\s+.*
#REGEX = \w{3}\s+\d{1,2}\s\d{2}:\d{2}:\d{2}\s(?:[\w.]+\s)?(\w+)
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::pfsense:$1

